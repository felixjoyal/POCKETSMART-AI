{% extends "base.html" %}{% block title %}Login{% endblock %}{% block content %}
<div class="container"><div class="card form-card"><h1>Welcome back</h1>
{% if error %}<div class="alert">{{ error }}</div>{% endif %}{% if request.query_params.get("registered") %}<div class="summary">Account created. You can now log in.</div>{% endif %}
<form method="post" action="/login"><label>Username</label><input name="username" required autocomplete="username">
<label>Password</label><input name="password" type="password" required autocomplete="current-password">
<button class="btn" type="submit">Sign in</button></form><p>Don't have an account? <a href="/register">Create one</a></p>
</div></div>{% endblock %}
