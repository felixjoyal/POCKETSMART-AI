{% extends "base.html" %}{% block title %}Register{% endblock %}{% block content %}
<div class="container"><div class="card form-card"><h1>Create your account</h1>{% if error %}<div class="alert">{{ error }}</div>{% endif %}
<form method="post" action="/register"><label>Username</label><input name="username" required minlength="3" maxlength="50">
<label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required minlength="8">
<button class="btn" type="submit">Create account</button></form><p>Already have an account? <a href="/login">Sign in</a></p>
</div></div>{% endblock %}
