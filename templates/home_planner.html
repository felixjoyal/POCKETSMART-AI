{% extends "base.html" %}{% block title %}Home Planner{% endblock %}{% block content %}
<section class="planner-head"><div class="container"><h1>Home Interior Budget Planner</h1><p>Set your budget and home requirements.</p></div></section>
<div class="container"><div class="card"><form id="homeForm">
<label>Total budget (INR)</label><input id="budget" type="number" min="1" required placeholder="50000">
<label>Rooms</label><select id="rooms" multiple><option>Living Room</option><option>Kitchen</option><option>Bedroom</option><option>Dining Room</option></select>
<div class="grid-2"><div><label>Number of lights</label><input id="lights" type="number" min="0" value="2"></div>
<div><label>Number of fans</label><input id="fans" type="number" min="0" value="1"></div>
<div><label>Furniture item count</label><input id="furniture_items" type="number" min="0" value="3"></div>
<div><label>Style</label><input id="style" value="Modern"></div></div>
<label>Additional requirements</label><textarea id="notes" placeholder="Example: small apartment, easy-to-clean furniture"></textarea>
<button class="btn" type="submit">Generate recommendations</button><div class="loading">Generating your plan...</div>
</form></div><div id="result" class="result"></div></div>
<script src="/static/js/app.js"></script><script>
document.getElementById("homeForm").addEventListener("submit",function(e){e.preventDefault();
const rooms=[...document.getElementById("rooms").selectedOptions].map(x=>x.value);
postJson("/api/generate-home",{budget:Number(formValue("budget")),rooms,lights:Number(formValue("lights")||0),fans:Number(formValue("fans")||0),furniture_items:Number(formValue("furniture_items")||0),style:formValue("style"),notes:formValue("notes")},"result",e.submitter)});
</script>{% endblock %}
